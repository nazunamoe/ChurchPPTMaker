# x64·ARM64 exe 빌드 + 실행 시험 (PowerPoint 없이 확인할 수 있는 것만 — tools/smoke_test.py)
# 실행: 브랜치에 푸시할 때(문서(.md)만 바뀐 푸시는 제외), v 로 시작하는 태그(예: v1.0.11), 또는 저장소 [Actions] → [build] →
#       [Run workflow] (수동 실행은 이 파일이 기본 브랜치(main)에 있어야 보임).
# 결과 exe: 실행 결과 화면 아래 Artifacts 의 ChurchPPTMaker-x64 / ChurchPPTMaker-arm64 (zip 으로 받아짐).
# ARM64 는 PyInstaller 가 교차 빌드를 못 해서 GitHub 의 Windows 11 ARM64 실행기(windows-11-arm, 공개 저장소 무료)에서 만든다.
name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']   # 태그 푸시에는 적용되지 않음 (GitHub 규칙)

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: win-amd64
            venv: .venv
            exe: ChurchPPTMaker.exe
          - arch: arm64
            runner: windows-11-arm
            platform: win-arm64
            venv: .venv-arm64
            exe: ChurchPPTMaker-arm64.exe
    defaults:
      run:
        shell: powershell   # build.bat 과 같은 Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}

      - name: exe 빌드
        # pythonLocation = setup-python 이 설치한 Python 폴더 (실행기에 미리 깔린 다른 Python 이 아니라 이것으로)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Arch ${{ matrix.arch }} -Python "$env:pythonLocation\python.exe"

      - name: exe 올리기
        uses: actions/upload-artifact@v7
        with:
          name: ChurchPPTMaker-${{ matrix.arch }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

      - name: 실행 시험 (소스)
        run: .\${{ matrix.venv }}\Scripts\python.exe tools\smoke_test.py --expect ${{ matrix.platform }}

      - name: 실행 시험 (exe)
        run: .\${{ matrix.venv }}\Scripts\python.exe tools\smoke_test.py --exe dist\${{ matrix.exe }} --expect ${{ matrix.platform }}
